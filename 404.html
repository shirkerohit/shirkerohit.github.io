<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Not found | Rohit Shirke</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #121518;
            --surface: #1a1e22;
            --text: #f0f3f4;
            --muted: #9da5ac;
            --accent: #8fb9a8;
            --border: #2c333a;
            --font-serif: 'Source Serif 4', Georgia, serif;
            --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans, var(--font-mono));
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .card {
            padding: 3rem 2rem;
            max-width: 640px;
            width: 92%;
        }
        .code {
            font-family: var(--font-mono);
            font-size: clamp(2.5rem, 10vw, 5rem);
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--muted);
            margin-bottom: 0.5rem;
        }
        .code strong {
            color: var(--accent);
        }
        h1 {
            font-family: var(--font-serif);
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 600;
            margin-bottom: 1.25rem;
            letter-spacing: -0.02em;
        }
        .quote {
            font-family: var(--font-serif);
            font-size: clamp(1.05rem, 3vw, 1.35rem);
            font-style: italic;
            color: var(--text);
            line-height: 1.7;
            margin-bottom: 1rem;
            border-left: 3px solid var(--border);
            padding-left: 1rem;
            text-align: left;
        }
        .attribution {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            text-align: left;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1.4rem;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--surface);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 0.82rem;
            letter-spacing: 0.08em;
            text-decoration: none;
            transition: border-color 180ms ease, color 180ms ease;
        }
        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .hint {
            margin-top: 2rem;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">404</div>
        <h1>Not found</h1>
        <div class="quote">
            “We can only see a short distance ahead, but we can see plenty there that needs to be done.”
        </div>
        <div class="attribution">— Alan Turing</div>
        <a href="/" class="btn">⟵ Back to home</a>
        <div class="hint">Request path not recognized</div>
    </div>
</body>
</html>
